name: Stage 02 checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: cryptosniper_ci
          POSTGRES_USER: cryptosniper
          POSTGRES_PASSWORD: ephemeral-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cryptosniper -d cryptosniper_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-bookworm
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://cryptosniper:ephemeral-ci-only@127.0.0.1:5432/cryptosniper_ci
      REDIS_CACHE_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.19'
          enable-cache: true
      - name: Generate private transient test secret
        run: |
          python - <<'PY'
          import os, secrets
          value = secrets.token_urlsafe(64)
          print('::add-mask::' + value)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('DJANGO_SECRET_KEY=' + value + '\n')
          PY
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Lint and format
        run: |
          uv run ruff check backend tests scripts
          uv run ruff format --check backend tests scripts
      - name: Schema and Django checks
        run: |
          uv run python backend/manage.py check
          uv run python backend/manage.py makemigrations --check --dry-run
          uv run python backend/manage.py migrate --noinput
          uv run python backend/manage.py collectstatic --noinput
      - name: Unit and PostgreSQL integration tests
        run: uv run pytest --junitxml=.runtime/pytest.xml
      - name: Install browser for UI smoke
        run: uv run playwright install --with-deps chromium
      - name: Real Worker, Beat, HTTP and mobile/desktop smoke
        run: uv run python scripts/smoke.py
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-02-evidence
          path: |
            .runtime/pytest.xml
            .runtime/screenshots/*.png
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
