name: Inspect live CryptoSniper app shell
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  inspect:
    if: ${{ contains(github.event.head_commit.message, '[inspect-live-app]') }}
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch public app shell and assets
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://srun.ir/cryptosniper/app/'
          mkdir -p /tmp/live
          curl -kfsSL -D /tmp/live/headers.txt "$BASE" -o /tmp/live/index.html || true
          echo '===== HEADERS ====='
          sed -n '1,80p' /tmp/live/headers.txt || true
          echo '===== INDEX ====='
          sed -n '1,220p' /tmp/live/index.html || true
          echo '===== ASSET URLS ====='
          grep -Eo '(<script[^>]+src="[^"]+"|<link[^>]+href="[^"]+")' /tmp/live/index.html || true
          python3 - <<'PY'
          import re, urllib.parse, urllib.request, pathlib, ssl
          base='https://srun.ir/cryptosniper/app/'
          text=pathlib.Path('/tmp/live/index.html').read_text(errors='ignore')
          urls=[]
          for pat in [r'<script[^>]+src=["\']([^"\']+)', r'<link[^>]+href=["\']([^"\']+)']:
              urls += re.findall(pat, text)
          ctx=ssl._create_unverified_context()
          for u in urls:
              if not (u.endswith('.js') or u.endswith('.css')): continue
              full=urllib.parse.urljoin(base,u)
              print('===== ASSET', full, '=====')
              try:
                  data=urllib.request.urlopen(full, context=ctx, timeout=20).read().decode('utf-8','replace')
                  print(data[:120000])
              except Exception as e:
                  print('FETCH_ERROR', type(e).__name__, str(e))
          PY
