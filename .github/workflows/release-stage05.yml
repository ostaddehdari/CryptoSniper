name: Build Stage05 installation files
on:
  push:
    paths:
      - .github/workflows/release-stage05.yml
      - scripts/cryptosniper-stage05-run.sh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate pinned cumulative ZIP and signed-by-hash installer
        shell: bash
        run: |
          set -euo pipefail
          PIN=156018079c4a85c0079bf12643973f439f05786e
          mkdir -p dist
          git cat-file -e "$PIN^{commit}"
          git archive --format=zip --prefix=CryptoSniper/ -o dist/CryptoSniper-Stage05-v0.5.0rc1.zip "$PIN"
          cp scripts/cryptosniper-stage05-run.sh dist/cryptosniper-stage05-run.sh
          SHA=$(sha256sum dist/CryptoSniper-Stage05-v0.5.0rc1.zip | awk '{print $1}')
          sed -i "s/__SOURCE_COMMIT__/$PIN/g" dist/cryptosniper-stage05-run.sh
          sed -i "s/__STAGE05_ARCHIVE_SHA256__/$SHA/g" dist/cryptosniper-stage05-run.sh
          sed -i "s/__BLOB_PYPROJECT__/$(git rev-parse "$PIN:pyproject.toml")/g" dist/cryptosniper-stage05-run.sh
          sed -i "s/__BLOB_UVLOCK__/$(git rev-parse "$PIN:uv.lock")/g" dist/cryptosniper-stage05-run.sh
          sed -i "s/__BLOB_PROGRESS__/$(git rev-parse "$PIN:docs/progress.json")/g" dist/cryptosniper-stage05-run.sh
          sed -i "s/__BLOB_TRADEPLANS__/$(git rev-parse "$PIN:backend/apps/tradeplans/calculations.py")/g" dist/cryptosniper-stage05-run.sh
          ! grep -Eq '__[A-Z0-9_]+__' dist/cryptosniper-stage05-run.sh
          chmod +x dist/cryptosniper-stage05-run.sh
          bash -n dist/cryptosniper-stage05-run.sh
          bash dist/cryptosniper-stage05-run.sh --check dist/CryptoSniper-Stage05-v0.5.0rc1.zip
          sha256sum dist/CryptoSniper-Stage05-v0.5.0rc1.zip dist/cryptosniper-stage05-run.sh | tee dist/SHA256SUMS.txt
      - name: Publish GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=stage05-v0.5.0rc1-deploy
          PIN=156018079c4a85c0079bf12643973f439f05786e
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$PIN" --prerelease \
              --title "CryptoSniper Stage 05 - v0.5.0rc1 cumulative preview" \
              --notes "Stage01-05 cumulative source, Django Manual Entry and immutable trade-plan snapshots. CI: 61 pytest passed + PostgreSQL Redis Worker Beat Chromium. Stage03 Binance real provider test and Stage04 gaps remain open. Real orders are intentionally disabled."
          fi
          gh release view "$TAG" --json assets,url
