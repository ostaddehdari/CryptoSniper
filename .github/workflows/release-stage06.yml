name: Build Stage06 installation files
on:
  push:
    paths:
      - .github/workflows/release-stage06.yml
      - scripts/cryptosniper-stage06-run.sh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build immutable cumulative ZIP and installer
        shell: bash
        run: |
          set -euo pipefail
          PIN=2718263fb39c37e615a667ead65b039c9f659a58
          mkdir -p dist
          git cat-file -e "$PIN^{commit}"
          git archive --format=zip --prefix=CryptoSniper/ -o dist/CryptoSniper-Stage06-v0.6.0rc1.zip "$PIN"
          cp scripts/cryptosniper-stage06-run.sh dist/cryptosniper-stage06-run.sh
          SHA=$(sha256sum dist/CryptoSniper-Stage06-v0.6.0rc1.zip | awk '{print $1}')
          sed -i "s/__SOURCE_COMMIT__/$PIN/g" dist/cryptosniper-stage06-run.sh
          sed -i "s/__STAGE06_ARCHIVE_SHA256__/$SHA/g" dist/cryptosniper-stage06-run.sh
          sed -i "s/__BLOB_PYPROJECT__/$(git rev-parse "$PIN:pyproject.toml")/g" dist/cryptosniper-stage06-run.sh
          sed -i "s/__BLOB_UVLOCK__/$(git rev-parse "$PIN:uv.lock")/g" dist/cryptosniper-stage06-run.sh
          sed -i "s/__BLOB_PROGRESS__/$(git rev-parse "$PIN:docs/progress.json")/g" dist/cryptosniper-stage06-run.sh
          sed -i "s/__BLOB_SIGNALS__/$(git rev-parse "$PIN:backend/apps/signals/models.py")/g" dist/cryptosniper-stage06-run.sh
          ! grep -Eq '__[A-Z0-9_]+__' dist/cryptosniper-stage06-run.sh
          chmod +x dist/cryptosniper-stage06-run.sh
          bash -n dist/cryptosniper-stage06-run.sh
          bash dist/cryptosniper-stage06-run.sh --check dist/CryptoSniper-Stage06-v0.6.0rc1.zip
          sha256sum dist/CryptoSniper-Stage06-v0.6.0rc1.zip dist/cryptosniper-stage06-run.sh | tee dist/SHA256SUMS.txt
      - name: Publish source and installer on GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=stage06-v0.6.0rc1-deploy
          PIN=2718263fb39c37e615a667ead65b039c9f659a58
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$PIN" --prerelease \
              --title "CryptoSniper Stage 06 — v0.6.0rc1 cumulative" \
              --notes "Stage01-06 cumulative code, signal sources/raw revisions/inbox human review. 66 PostgreSQL tests + browser/worker smoke successful in CI. Binance real account verification in S03 still pending; NO Telegram/AI integration and NO live orders."
          fi
          gh release view "$TAG" --json assets,url
