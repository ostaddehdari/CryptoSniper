name: Build Stage07 and Stage08 cumulative deployment
on:
  push:
    paths:
      - .github/workflows/release-stage08.yml
      - scripts/cryptosniper-stage08-run.sh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble immutable, validated source and installer
        shell: bash
        run: |
          set -euo pipefail
          PIN=04d84c0e5ef75155bce32a173c2441e20f0f5080
          mkdir -p dist
          git cat-file -e "$PIN^{commit}"
          git archive --format=zip --prefix=CryptoSniper/ -o dist/CryptoSniper-Stage08-v0.8.0rc1.zip "$PIN"
          cp scripts/cryptosniper-stage08-run.sh dist/cryptosniper-stage08-run.sh
          SHA=$(sha256sum dist/CryptoSniper-Stage08-v0.8.0rc1.zip | awk '{print $1}')
          sed -i "s/__SOURCE_COMMIT__/$PIN/g" dist/cryptosniper-stage08-run.sh
          sed -i "s/__STAGE08_ARCHIVE_SHA256__/$SHA/g" dist/cryptosniper-stage08-run.sh
          sed -i "s/__BLOB_PYPROJECT__/$(git rev-parse "$PIN:pyproject.toml")/g" dist/cryptosniper-stage08-run.sh
          sed -i "s/__BLOB_UVLOCK__/$(git rev-parse "$PIN:uv.lock")/g" dist/cryptosniper-stage08-run.sh
          sed -i "s/__BLOB_PROGRESS__/$(git rev-parse "$PIN:docs/progress.json")/g" dist/cryptosniper-stage08-run.sh
          sed -i "s/__BLOB_TRADING__/$(git rev-parse "$PIN:backend/apps/trading/models.py")/g" dist/cryptosniper-stage08-run.sh
          ! grep -Eq '__[A-Z0-9_]+__' dist/cryptosniper-stage08-run.sh
          chmod +x dist/cryptosniper-stage08-run.sh
          bash -n dist/cryptosniper-stage08-run.sh
          bash dist/cryptosniper-stage08-run.sh --check dist/CryptoSniper-Stage08-v0.8.0rc1.zip
          sha256sum dist/CryptoSniper-Stage08-v0.8.0rc1.zip dist/cryptosniper-stage08-run.sh | tee dist/SHA256SUMS.txt
      - name: Publish versioned release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=stage08-v0.8.0rc1-deploy
          PIN=04d84c0e5ef75155bce32a173c2441e20f0f5080
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$PIN" --prerelease \
              --title "CryptoSniper Stages 07+08 — cumulative v0.8.0rc1" \
              --notes "Stage01-08 cumulative, deterministic Smart Paste Parser, Inbox review and durable Paper-only trade/position lifecycle. 76 Pytest passed plus PostgreSQL/Redis/Celery/Chromium integration on https://github.com/ostaddehdari/CryptoSniper/actions/runs/38954065804. Real Binance orders remain disabled. Stage09/10 protective exits are not implemented."
          fi
          gh release view "$TAG" --json assets,url
