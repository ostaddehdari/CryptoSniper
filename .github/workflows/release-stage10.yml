name: Build Stage09-10 cumulative deployment
on:
  push:
    paths:
      - .github/workflows/release-stage10.yml
      - scripts/cryptosniper-stage10-run.sh
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble validated immutable source and installer
        shell: bash
        run: |
          set -euo pipefail
          PIN=acde2adbe6a37d0ab875e7aff078beae4e7c6907
          mkdir -p dist
          git cat-file -e "$PIN^{commit}"
          git archive --format=zip --prefix=CryptoSniper/ -o dist/CryptoSniper-Stage10-v0.10.0rc1.zip "$PIN"
          cp scripts/cryptosniper-stage10-run.sh dist/cryptosniper-stage10-run.sh
          SHA=$(sha256sum dist/CryptoSniper-Stage10-v0.10.0rc1.zip | awk '{print $1}')
          sed -i "s/__SOURCE_COMMIT__/$PIN/g" dist/cryptosniper-stage10-run.sh
          sed -i "s/__STAGE10_ARCHIVE_SHA256__/$SHA/g" dist/cryptosniper-stage10-run.sh
          sed -i "s/__BLOB_PYPROJECT__/$(git rev-parse "$PIN:pyproject.toml")/g" dist/cryptosniper-stage10-run.sh
          sed -i "s/__BLOB_UVLOCK__/$(git rev-parse "$PIN:uv.lock")/g" dist/cryptosniper-stage10-run.sh
          sed -i "s/__BLOB_PROGRESS__/$(git rev-parse "$PIN:docs/progress.json")/g" dist/cryptosniper-stage10-run.sh
          sed -i "s/__BLOB_EXITS_ENGINE__/$(git rev-parse "$PIN:backend/apps/trading/exits_engine.py")/g" dist/cryptosniper-stage10-run.sh
          ! grep -Eq '__[A-Z0-9_]+__' dist/cryptosniper-stage10-run.sh
          chmod +x dist/cryptosniper-stage10-run.sh
          bash -n dist/cryptosniper-stage10-run.sh
          bash dist/cryptosniper-stage10-run.sh --check dist/CryptoSniper-Stage10-v0.10.0rc1.zip
          sha256sum dist/CryptoSniper-Stage10-v0.10.0rc1.zip dist/cryptosniper-stage10-run.sh | tee dist/SHA256SUMS.txt
      - name: Publish exact release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=stage10-v0.10.0rc1-deploy
          PIN=acde2adbe6a37d0ab875e7aff078beae4e7c6907
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --target "$PIN" --prerelease \
              --title "CryptoSniper Stages 09+10 — cumulative v0.10.0rc1" \
              --notes "Stages 01-10 cumulative source. Paper simulator-only TP/SL and step/percentage trailing with immutable exit ledger, managed by Worker, no native exchange stop. 86 PostgreSQL tests and browser/Worker CI passed: https://github.com/ostaddehdari/CryptoSniper/actions/runs/38959567887. REAL Binance trading and Margin/Short remain disabled."
          fi
          gh release view "$TAG" --json assets,url
