name: Build Stage17-18 cumulative deployment
on:
  push:
    paths:
      - .github/workflows/release-stage18.yml
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Installer upgrade, unmanaged config and rollback regression tests
        run: python3 -m unittest discover -s tests -p test_installer_nginx.py -v
      - name: Require successful integration checks for the exact source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PIN=d85438435c3395d55700ad777e2009beb2e61391
          export PIN
          python3 - <<'PYCI'
          import json,os,subprocess,time
          pin=os.environ['PIN']
          for attempt in range(120):
              rows=json.loads(subprocess.check_output(['gh','run','list','--workflow','ci.yml','--commit',pin,'--json','conclusion,status,url'],text=True))
              if any(r['status']=='completed' and r['conclusion']=='success' for r in rows):
                  print('PASS: exact source completed CI.')
                  break
              if any(r['status']=='completed' and r['conclusion'] in ('failure','cancelled') for r in rows):
                  raise SystemExit('Exact-source CI failed; no release is permitted.')
              time.sleep(5)
          else:
              raise SystemExit('Timed out waiting for exact-source CI; no release.')
          PYCI
      - name: Assemble exact source and validated installer
        shell: bash
        run: |
          set -euo pipefail
          PIN=d85438435c3395d55700ad777e2009beb2e61391
          export PIN
          mkdir -p dist
          git archive --format=zip --prefix=CryptoSniper/ -o dist/CryptoSniper-Stage18-v0.18.0rc1.zip "$PIN"
          git show "$PIN":scripts/cryptosniper-stage18-run.sh > dist/cryptosniper-stage18-run.sh
          python3 - <<'PY'
          import hashlib,os,re,subprocess
          from pathlib import Path
          pin=os.environ['PIN']
          def blob(path):
              return subprocess.check_output(['git','rev-parse',pin+':'+path],text=True).strip()
          archive=Path('dist/CryptoSniper-Stage18-v0.18.0rc1.zip')
          substitutions={
              '__SOURCE_COMMIT__':pin,
              '__STAGE18_ARCHIVE_SHA256__':hashlib.file_digest(archive.open('rb'),'sha256').hexdigest(),
              '__BLOB_PYPROJECT__':blob('pyproject.toml'),
              '__BLOB_UVLOCK__':blob('uv.lock'),
              '__BLOB_PROGRESS__':blob('docs/progress.json'),
              '__BLOB_EXITS_ENGINE__':blob('backend/apps/trading/exits_engine.py'),
              '__BLOB_RECOVERY__':blob('backend/apps/operations/recovery.py'),
              '__BLOB_ALERT_ENGINE__':blob('backend/apps/alerts/engine.py'),
              '__BLOB_TRADE_ACTIONS__':blob('backend/apps/trading/actions.py'),
              '__BLOB_PORTFOLIO_METRICS__':blob('backend/apps/portfolio/metrics.py'),
              '__BLOB_REPORT_SERVICE__':blob('backend/apps/reports/service.py'),
              '__BLOB_REPORT_TASKS__':blob('backend/apps/reports/tasks.py'),
              '__BLOB_CORE_VIEWS__':blob('backend/apps/core/views.py'),
              '__BLOB_CORE_SECURITY__':blob('backend/apps/core/security.py'),
              '__BLOB_MARGIN__':blob('backend/apps/trading/margin.py'),
              '__BLOB_BOUNDARY__':blob('backend/apps/trading/boundary.py'),
          }
          path=Path('dist/cryptosniper-stage18-run.sh')
          text=path.read_text()
          for old,new in substitutions.items():
              if old not in text: raise SystemExit('Missing placeholder '+old)
              text=text.replace(old,new)
          if re.search(r'__[A-Z0-9_]+__',text): raise SystemExit('Unexpanded placeholders')
          path.write_text(text)
          PY
          chmod +x dist/cryptosniper-stage18-run.sh
          bash -n dist/cryptosniper-stage18-run.sh
          printf 'SOURCE=%s\nCI=https://github.com/ostaddehdari/CryptoSniper/actions/runs/39108160196\nMODE=Hardened deterministic Paper Spot/Margin; no real exchange writes\nINSTALLER_BUILD_COMMIT=%s\n' "$PIN" "$(git rev-parse HEAD)" > dist/runlog.txt
          bash dist/cryptosniper-stage18-run.sh --check dist/CryptoSniper-Stage18-v0.18.0rc1.zip | tee -a dist/runlog.txt
          (cd dist && sha256sum CryptoSniper-Stage18-v0.18.0rc1.zip cryptosniper-stage18-run.sh runlog.txt > SHA256SUMS.txt)
      - name: Save exact deployment bytes for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: stage18-deployment
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish immutable cumulative prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=stage18-v0.18.0rc1-deploy
          PIN=d85438435c3395d55700ad777e2009beb2e61391
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; assets are immutable. Verify the existing release.'
          else
            gh release create "$TAG" dist/* --target "$PIN" --prerelease \
              --title "CryptoSniper Stages 17+18 — cumulative v0.18.0rc1" \
              --notes "Cumulative Stages 01-18: hardened ownership, CSRF/XSS/SSRF controls, credential rotation/revocation/encrypted backup, password step-up and honest 2FA readiness, rate/retention controls; deterministic Paper Spot/Margin Long/Short with partial fills, latency, rejection, borrow/interest/repay, failure injection and recovery. Exact-source CI passed 194 tests plus PostgreSQL/Redis/Workers/Beat/Chromium. Binance writes remain disabled and sandbox/live is unverified. Telegram/channel/AI remains Stage21. Exact-source CI: https://github.com/ostaddehdari/CryptoSniper/actions/runs/39108160196."
          fi
          cat dist/SHA256SUMS.txt
          gh release view "$TAG" --json assets,url
