name: Build Stage25 React Cornix deployment

on:
  push:
    branches: [stage25-react-cornix-rebuild]
    paths:
      - .github/workflows/release-stage25-react.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Validate installer upgrade path
        run: |
          set -euo pipefail
          bash -n scripts/cryptosniper-stage25-react-run.sh
          python3 -m unittest discover -s tests -p test_installer_nginx.py -v

      - name: Require successful integration checks for exact source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PIN=$(git rev-parse HEAD)
          export PIN
          python3 - <<'PYCI'
          import json, os, subprocess, time
          pin = os.environ["PIN"]
          for _ in range(180):
              rows = json.loads(subprocess.check_output(
                  ["gh", "run", "list", "--workflow", "ci.yml", "--commit", pin,
                   "--json", "conclusion,status,url"], text=True
              ))
              if any(row["status"] == "completed" and row["conclusion"] == "success" for row in rows):
                  print("PASS: exact source completed CI.")
                  break
              if any(row["status"] == "completed" and row["conclusion"] == "failure" for row in rows):
                  raise SystemExit("Exact-source CI failed; no release is permitted.")
              time.sleep(5)
          else:
              raise SystemExit("Timed out waiting for exact-source CI; no release.")
          PYCI

      - name: Build approved React workspace
        working-directory: frontend-react
        run: |
          set -euo pipefail
          npm ci
          npm run build
          test -s ../backend/static/react/app.js
          test -s ../backend/static/react/app.css

      - name: Assemble exact source plus pinned React build
        shell: bash
        run: |
          set -euo pipefail
          PIN=$(git rev-parse HEAD)
          export PIN
          mkdir -p dist stage/CryptoSniper

          git archive "$PIN" | tar -x -C stage/CryptoSniper
          install -D -m 0644 backend/static/react/app.js stage/CryptoSniper/backend/static/react/app.js
          install -D -m 0644 backend/static/react/app.css stage/CryptoSniper/backend/static/react/app.css
          install -D -m 0644 backend/static/react/index.html stage/CryptoSniper/backend/static/react/index.html

          (
            cd stage
            zip -qr ../dist/CryptoSniper-Stage25-React-v0.25.0rc1-r1.zip CryptoSniper
          )

          git show "$PIN":scripts/cryptosniper-stage25-react-run.sh > dist/cryptosniper-stage25-react-run.sh

          python3 - <<'PY'
          import hashlib, os, re, subprocess
          from pathlib import Path

          pin = os.environ["PIN"]

          def blob(path):
              return subprocess.check_output(
                  ["git", "rev-parse", pin + ":" + path], text=True
              ).strip()

          archive = Path("dist/CryptoSniper-Stage25-React-v0.25.0rc1-r1.zip")
          substitutions = {
              "__SOURCE_COMMIT__": pin,
              "__STAGE25_ARCHIVE_SHA256__": hashlib.file_digest(
                  archive.open("rb"), "sha256"
              ).hexdigest(),
              "__BLOB_PYPROJECT__": blob("pyproject.toml"),
              "__BLOB_UVLOCK__": blob("uv.lock"),
              "__BLOB_PROGRESS__": blob("docs/progress.json"),
              "__BLOB_EXITS_ENGINE__": blob("backend/apps/trading/exits_engine.py"),
              "__BLOB_RECOVERY__": blob("backend/apps/operations/recovery.py"),
              "__BLOB_ALERT_ENGINE__": blob("backend/apps/alerts/engine.py"),
              "__BLOB_TRADE_ACTIONS__": blob("backend/apps/trading/actions.py"),
              "__BLOB_PORTFOLIO_METRICS__": blob("backend/apps/portfolio/metrics.py"),
              "__BLOB_REPORT_SERVICE__": blob("backend/apps/reports/service.py"),
              "__BLOB_REPORT_TASKS__": blob("backend/apps/reports/tasks.py"),
              "__BLOB_CORE_VIEWS__": blob("backend/apps/core/views.py"),
              "__BLOB_CORE_SECURITY__": blob("backend/apps/core/security.py"),
              "__BLOB_MARGIN__": blob("backend/apps/trading/margin.py"),
              "__BLOB_BOUNDARY__": blob("backend/apps/trading/boundary.py"),
              "__BLOB_HOSTING__": blob("backend/apps/operations/hosting.py"),
              "__BLOB_BACKUPS__": blob("backend/apps/operations/backups.py"),
              "__BLOB_MONITORING__": blob("backend/apps/operations/monitoring.py"),
              "__BLOB_ACCEPTANCE__": blob("backend/apps/operations/acceptance.py"),
              "__BLOB_TELEGRAM_CLIENT__": blob("backend/apps/signals/telegram_client.py"),
              "__BLOB_TELEGRAM_INGESTION__": blob("backend/apps/signals/telegram_ingestion.py"),
              "__BLOB_TELEGRAM_BACKFILL__": blob("backend/apps/signals/backfill.py"),
              "__BLOB_SIGNAL_OUTCOMES__": blob("backend/apps/signals/outcomes.py"),
              "__BLOB_MARKET_HISTORY__": blob("backend/apps/marketdata/history.py"),
              "__BLOB_STAGE23_REPORT__": blob("docs/reports/stage-23.md"),
              "__BLOB_LIVE_ORDERS__": blob("backend/apps/exchanges/live_orders.py"),
              "__BLOB_TRADEPLAN_FORMS__": blob("backend/apps/tradeplans/forms.py"),
              "__BLOB_TRADEPLAN_CALCULATIONS__": blob("backend/apps/tradeplans/calculations.py"),
              "__BLOB_EXTERNAL_MANAGEMENT__": blob("backend/apps/portfolio/external_management.py"),
              "__BLOB_SIGNAL_VIEWS__": blob("backend/apps/signals/views.py"),
              "__BLOB_EXCHANGE_VIEWS__": blob("backend/apps/exchanges/views.py"),
              "__BLOB_NOBITEX__": blob("backend/apps/exchanges/nobitex.py"),
              "__BLOB_LBANK__": blob("backend/apps/exchanges/lbank.py"),
              "__BLOB_SPOT_V3__": blob("backend/apps/exchanges/spot_v3.py"),
              "__BLOB_BITUNIX__": blob("backend/apps/exchanges/bitunix.py"),
              "__BLOB_SECURITY_SCAN__": blob("scripts/security_scan.py"),
              "__BLOB_STAGE24_CHART__": blob("backend/apps/marketdata/chart.py"),
              "__BLOB_STAGE24_TICKER__": blob("backend/apps/marketdata/views.py"),
              "__BLOB_STAGE24_URLS__": blob("backend/config/urls.py"),
              "__BLOB_STAGE24_BASE_TEMPLATE__": blob("backend/templates/base.html"),
              "__BLOB_STAGE24_SHELL_TEMPLATE__": blob("backend/templates/shell.html"),
              "__BLOB_STAGE24_TRADES_API__": blob("backend/apps/portfolio/api_stage24.py"),
              "__BLOB_STAGE24_SIGNAL_ARCHIVE__": blob("backend/apps/signals/archive.py"),
              "__BLOB_STAGE24_APP_TEMPLATE__": blob("backend/templates/core/app_stage24_rebuild.html"),
              "__BLOB_STAGE24_APP_JS__": blob("backend/static/js/stage24-rebuild.js"),
              "__BLOB_STAGE24_APP_CSS__": blob("backend/static/css/stage24-rebuild.css"),
              "__BLOB_STAGE24_REPORT__": blob("docs/reports/stage-24-rebuild.md"),
              "__BLOB_REACT_PACKAGE__": blob("frontend-react/package.json"),
              "__BLOB_REACT_PACKAGE_LOCK__": blob("frontend-react/package-lock.json"),
              "__BLOB_REACT_VITE__": blob("frontend-react/vite.config.js"),
              "__BLOB_REACT_MAIN__": blob("frontend-react/src/main.jsx"),
              "__BLOB_REACT_APPROVED_CSS__": blob("frontend-react/src/styles.css"),
              "__BLOB_REACT_STAGE25_CSS__": blob("frontend-react/src/stage25.css"),
              "__BLOB_REACT_VIEWS__": blob("backend/apps/core/react_views.py"),
              "__BLOB_REACT_TEMPLATE__": blob("backend/templates/react_app.html"),
              "__BLOB_ACCOUNTS_MODELS__": blob("backend/apps/accounts/models.py"),
              "__BLOB_MARKETDATA_MODELS__": blob("backend/apps/marketdata/models.py"),
              "__BLOB_WALLET_MIGRATION__": blob(
                  "backend/apps/accounts/migrations/0007_walletconnection.py"
              ),
              "__BLOB_FAVORITE_MIGRATION__": blob(
                  "backend/apps/marketdata/migrations/0003_favoriteasset.py"
              ),
              "__BLOB_EXCHANGE_DIAGNOSTICS_MIGRATION__": blob(
                  "backend/apps/exchanges/migrations/0008_react_connection_diagnostics.py"
              ),
              "__BLOB_STAGE25_REPORT__": blob("docs/reports/stage-25-react.md"),
              "__REACT_APP_JS_SHA256__": hashlib.file_digest(
                  Path("backend/static/react/app.js").open("rb"), "sha256"
              ).hexdigest(),
              "__REACT_APP_CSS_SHA256__": hashlib.file_digest(
                  Path("backend/static/react/app.css").open("rb"), "sha256"
              ).hexdigest(),
          }

          path = Path("dist/cryptosniper-stage25-react-run.sh")
          text = path.read_text()
          for old, new in substitutions.items():
              if old not in text:
                  raise SystemExit("Missing placeholder " + old)
              text = text.replace(old, new)
          if re.search(r"__[A-Z0-9_]+__", text):
              raise SystemExit("Unexpanded placeholders")
          path.write_text(text)
          PY

          chmod +x dist/cryptosniper-stage25-react-run.sh
          bash -n dist/cryptosniper-stage25-react-run.sh

          printf 'SOURCE=%s\nUI=React 18 + Vite; approved Cornix-like workspace; Django APIs/workers preserved\nLIVE_WRITES=fail-closed by default\n' "$PIN" > dist/runlog.txt
          bash dist/cryptosniper-stage25-react-run.sh --check dist/CryptoSniper-Stage25-React-v0.25.0rc1-r1.zip | tee -a dist/runlog.txt

          (
            cd dist
            sha256sum CryptoSniper-Stage25-React-v0.25.0rc1-r1.zip cryptosniper-stage25-react-run.sh runlog.txt > SHA256SUMS.txt
          )

      - name: Save exact deployment bytes
        uses: actions/upload-artifact@v4
        with:
          name: stage25-react-cornix-deployment
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish immutable Stage25 React prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=stage25-react-v0.25.0rc1-deploy-r1
          PIN=$(git rev-parse HEAD)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; immutable assets were not replaced."
          else
            gh release create "$TAG" dist/* --target "$PIN" --prerelease \
              --title "CryptoSniper Stage25 React — v0.25.0rc1 installer r1" \
              --notes "Primary /cryptosniper workspace is the approved React/Vite Cornix-like UI from the validated Stage23 React source. The approved base stylesheet is byte-locked; Stage25 adds live charts, signal overlays, unified internal/live/external trades, archive lifecycle, account-scoped markets, USDT/USD and USDT/Toman tickers, Telegram/exchange/settings integration and the current Trailing SL/TP rules. Stage24 backend, PostgreSQL, Redis, workers, database, login and encrypted credentials are preserved. The server does not need Node; the pinned React build is included. Live writes remain fail-closed by default."
          fi
          cat dist/SHA256SUMS.txt
          gh release view "$TAG" --json assets,url
