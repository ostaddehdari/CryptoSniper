name: Stage05 temporary formatter
on:
  push:
    paths:
      - .github/workflows/stage05-format-once.yml
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Ruff fix and format
        run: |
          uv run ruff check backend tests scripts --fix || true
          uv run ruff format backend tests scripts
          uv run ruff check backend tests scripts || true
      - name: Commit only formatter changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend tests scripts
          if ! git diff --cached --quiet; then
            git commit -m "استیج ۰۵: یکدست‌سازی Ruff و اصلاح امن imports"
            git push origin HEAD:main
          fi
