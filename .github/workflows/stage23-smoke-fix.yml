name: Stage23 one-shot smoke flow fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[smoke-flow-fixed]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch Stage23 signal approval smoke flow
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path('scripts/smoke.py')
          text = path.read_text()
          pattern = re.compile(
              r'(?m)^(?P<indent>\s*)page\.get_by_role\("button", name="تأیید دستی \(بدون معامله\)"\)\.click\(\)\n'
              r'(?P=indent)page\.get_by_role\("link", name="ساخت Trade Plan از این سیگنال"\)\.click\(\)\n'
          )
          replacement = r'\g<indent>page.get_by_role("button", name="تأیید و انتقال به معامله").click()\n'
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected two-step smoke flow not found; replacements={count}')
          path.write_text(updated)
          PY
      - name: Commit smoke fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke.py
          git commit -m "fix(S23): همگام‌سازی Smoke با مسیر یک‌مرحله‌ای سیگنال [smoke-flow-fixed]"
          git push origin HEAD:main
