name: Stage28 build committed React assets
on:
  push:
    branches: [stage28-live-charts-archive-sync]
permissions:
  contents: write
jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[stage28-assets]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Build React
        run: |
          cd frontend-react
          npm ci --no-audit --no-fund
          npm run build
      - name: Commit exact production assets
        run: |
          if git diff --quiet -- backend/static/react; then
            echo 'Production React assets already match source.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/static/react
          git commit -m 'build(S28): compile production React assets [stage28-assets]'
          git push origin HEAD:stage28-live-charts-archive-sync
