name: Stage09-10 prepare schema and Ruff
on:
  push:
    paths:
      - .github/workflows/stages09-10-prepare-once.yml
permissions:
  contents: write
jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: cryptosniper
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: cryptosniper_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cryptosniper -d cryptosniper_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgresql://cryptosniper:ephemeral-ci-only@127.0.0.1:5432/cryptosniper_ci
      REDIS_CACHE_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python - <<'PY'
          import os,secrets
          value=secrets.token_urlsafe(64)
          print('::add-mask::'+value)
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('DJANGO_SECRET_KEY='+value+'\n')
          PY
      - run: uv sync --frozen
      - name: Create migration and fix Ruff
        run: |
          uv run python backend/manage.py makemigrations trading --noinput
          uv run ruff check backend tests scripts --fix || true
          uv run ruff format backend tests scripts
          uv run ruff check backend tests scripts || true
      - name: Commit formatted files and migrations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend tests scripts
          if ! git diff --cached --quiet; then
            git commit -m "استیج ۰۹ و ۱۰: تولید Migration و فرمت استاندارد Ruff"
            git push origin HEAD:main
          fi

