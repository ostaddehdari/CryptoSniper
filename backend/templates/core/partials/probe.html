{% if error %}<div class="s24-fact" role="alert" style="color:#c44756">ارتباط با صف برقرار نشد. وضعیت سرویس‌ها را بررسی کنید.</div>{% elif probe.status == 'succeeded' %}<div class="s24-fact"><span>نتیجه در پایگاه داده ثبت شد.</span><strong>پردازش مستقل با موفقیت انجام شد.</strong><code dir="ltr">{{ probe.correlation_id }}</code></div>{% else %}<div class="s24-fact" hx-get="{% url 'probe-status' probe.id %}" hx-trigger="every 2s" hx-swap="outerHTML"><span>در انتظار نتیجه Worker…</span><strong>پردازش در سرور ادامه دارد.</strong></div>{% endif %}
