# Optional local development services. Web and Worker also run without Docker.
services:
  postgres:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: cryptosniper
      POSTGRES_USER: cryptosniper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptosniper -d cryptosniper"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
